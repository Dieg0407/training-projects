services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
    networks:
      - shared

  cluster1:
    image: apache/kafka-native:4.2.1-rc3
    container_name: cluster1
    ports:
      - '19092:19092' 
    networks:
      - shared
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cluster1:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # The Fix: cluster1 votes ONLY for cluster1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cluster1:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  cluster2:
    image: apache/kafka-native:4.2.1-rc3
    container_name: cluster2
    ports:
      - '19093:19093' 
    networks:
      - shared
    environment:
      # Node ID is 1 again, because it's a brand new independent cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19093,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cluster2:9092,EXTERNAL://localhost:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # The Fix: cluster2 votes ONLY for cluster2
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cluster2:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafbat:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: on-failure
    ports:
      - 8080:8080
    depends_on:
      - cluster1
      - cluster2
    environment:
      KAFKA_CLUSTERS_0_NAME: cluster-1
      # Kafbat connects to the INTERNAL listener
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: cluster1:9092
      KAFKA_CLUSTERS_1_NAME: cluster-2
      # Kafbat connects to the INTERNAL listener
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: cluster2:9092
    networks:
      - shared

  kafka-init:
    image: apache/kafka:4.2.1-rc3
    container_name: kafka-init
    networks:
      - shared
    depends_on:
      - cluster1
      - cluster2
    # Using the array syntax makes multiline bash scripts bulletproof in YAML
    command:
      - /bin/bash
      - -c
      - |
        echo "Waiting for cluster 1 to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server cluster1:9092 --list > /dev/null 2>&1; do
          echo "Cluster 1 is unavailable - sleeping"
          sleep 2
        done
        echo "Cluster 1 is up! Creating topics..."
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server cluster1:9092 --partitions 3 --replication-factor 1 --topic test.request

        echo "Waiting for cluster 2 to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server cluster2:9092 --list > /dev/null 2>&1; do
          echo "Cluster 2 is unavailable - sleeping"
          sleep 2
        done
        echo "Cluster 2 is up! Creating topics..."
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server cluster2:9092 --partitions 3 --replication-factor 1 --topic test.response
        
        echo "All topics created successfully. Init container exiting."

networks:
  shared:
